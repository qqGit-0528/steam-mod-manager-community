name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SteamModManager.sln
      - name: Build
        run: dotnet build SteamModManager.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution SteamModManager.sln --configuration Release --no-build --no-ansi --no-progress --report-xunit-trx --results-directory artifacts/test-results
      - name: Publish desktop application
        run: dotnet publish src/Ck3ModManager.Desktop --configuration Release --no-restore --no-build --output artifacts/desktop
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: desktop-${{ matrix.os }}
          path: artifacts/desktop
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results
          retention-days: 7
